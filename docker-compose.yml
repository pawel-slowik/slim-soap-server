version: "3.4"

services:

  nginx:
    build:
      context: ./docker/nginx
      tags:
        - slim-soap-server-nginx
    depends_on:
      - php-fpm
    ports:
      - "${HTTP_PORT-8080}:80"

  php-fpm:
    build:
      context: ./docker/php-fpm
      tags:
        - slim-soap-server-php-fpm
    volumes:
      - .:/var/www/html
